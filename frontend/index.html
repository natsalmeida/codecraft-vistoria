<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CodeCraft Vistoria — TRE-TO 26ª ZE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

<!-- LOGIN -->
<div class="screen active" id="scr-login">
<div class="login-pg">
  <div class="anim-in" style="width:100%;max-width:400px">
    <div class="login-logo">
      <img src="logo.png" alt="TRE-TO" id="logo-img">
      <p>TRE-TO — 26ª Zona Eleitoral</p>
      <div style="color:var(--txt3);font-size:11px;margin-top:2px">CodeCraft Vistoria</div>
    </div>
    <div class="card">
      <div class="fg"><label class="fl">E-mail</label><input class="fi" type="email" id="inp-email" placeholder="seu.email@tre-to.jus.br" autocomplete="email"></div>
      <div class="fg"><label class="fl">Senha</label>
        <div style="position:relative"><input class="fi" type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
        <button type="button" id="pw-tog" style="position:absolute;right:12px;top:10px;background:none;border:none;color:var(--txt2);cursor:pointer;font-size:18px">👁️</button></div>
      </div>
      <div id="login-err" style="color:var(--red-l);font-size:13px;font-weight:600;margin-bottom:10px;display:none"></div>
      <button class="btn btn-gold btn-lg" id="login-btn" style="margin-top:8px">ENTRAR</button>
    </div>    
  </div>
</div>
</div>

<!-- GESTOR -->
<div class="screen" id="scr-gestor">
  <div class="hdr">
    <div class="hdr-brand"><img class="hdr-logo" id="g-logo" alt=""><div><h1>PAINEL DO GESTOR</h1><span id="g-name"></span></div></div>
    <button class="btn-gh" id="g-logout">Sair</button>
  </div>
  <div class="ysel"><button class="yb" id="g-yr-prev">‹</button><div class="yv" id="g-yr"></div><button class="yb" id="g-yr-next">›</button></div>
  <div class="ctn-w" id="g-content"></div>
  <div class="bnav" id="g-nav">
    <button class="ni act" data-t="g-home"><span class="nic">🏠</span><span class="nil">Início</span></button>
    <button class="ni" data-t="g-insp"><span class="nic">📋</span><span class="nil">Vistorias</span></button>
    <button class="ni" data-t="g-veic"><span class="nic">🚗</span><span class="nil">Veículos</span></button>
    <button class="ni" data-t="g-equip"><span class="nic">🔧</span><span class="nil">Acessórios</span></button>
    <button class="ni" data-t="g-users"><span class="nic">👥</span><span class="nil">Usuários</span></button>
  </div>
</div>

<!-- VISTORIADOR -->
<div class="screen" id="scr-vist">
  <div class="hdr">
    <div class="hdr-brand"><img class="hdr-logo" id="v-logo" alt=""><div><h1 id="v-title">CODECRAFT VISTORIA</h1><span id="v-name"></span></div></div>
    <div style="display:flex;gap:8px">
      <button class="btn-gh" id="v-back" style="display:none">← Voltar</button>
      <button class="btn-gh" id="v-logout">Sair</button>
    </div>
  </div>
  <div class="ysel" id="v-ysel"><button class="yb" id="v-yr-prev">‹</button><div class="yv" id="v-yr"></div><button class="yb" id="v-yr-next">›</button></div>
  <div class="ctn" id="v-content"></div>
  <div class="bnav" id="v-nav">
    <button class="ni act" data-t="v-home"><span class="nic">🏠</span><span class="nil">Início</span></button>
    <button class="ni" data-t="v-hist"><span class="nic">📋</span><span class="nil">Histórico</span></button>
    <button class="ni" data-t="v-veic"><span class="nic">🚗</span><span class="nil">Veículos</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-ov" id="modal-ov"><div class="modal" id="modal"></div></div>
<input type="file" id="photo-inp" accept="image/*" capture="environment" multiple style="display:none">
</div>

<script src="app.js"></script>
</body>
</html>
